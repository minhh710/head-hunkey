cat > index.html <<'EOF'
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HEADLOCK FILE SHARE</title>
<style>
body{background:#0d1324;color:#fff;font-family:Arial;padding:20px}

for f in uploads/*; do
